[workspace]
# The two wasm modules this package ships. They build into
# target/wasm32-wasip2/release/, which is where the package's lib SQL names
# them: `transcribe`, one cue per stretch of speech, and `transcribe-words`,
# one cue per word. `core` is the arithmetic both are built on - the
# spectrogram, the token ids, the parameters, the shape of a cue - and it
# ships nothing of its own; it is also where the host-side tests for all of
# that live.
members = [
    "core",
    "transcribe",
    "transcribe-words",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
